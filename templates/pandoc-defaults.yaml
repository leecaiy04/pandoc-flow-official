# Pandoc Defaults for Official Document Conversion (GB/T 9704-2012)
from: markdown
to: docx
standalone: true
highlight-style: pygments

variables:
  # Standard fonts for official documents
  mainfont: "仿宋_GB2312"
  CJKmainfont: "方正小标宋简体"
  # Heading styles are shifted by templates/official-document.lua:
  # #     -> Title (方正小标宋简体 二号 居中)
  # ##    -> heading 1 (黑体 三号)
  # ###   -> heading 2 (楷体_GB2312 三号)
  # ####  -> heading 3 (仿宋_GB2312 三号)
  # ##### -> heading 4 (仿宋_GB2312 三号)
